# QLoRA hyperparameters - fixed in advance, per technical_assignment.md
model_name: "Qwen/Qwen2.5-Coder-7B-Instruct"

lora:
  r: 16
  alpha: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

quantization:
  type: nf4
  double_quant: true

training:
  learning_rate: 2.0e-4
  batch_size: 4
  gradient_checkpointing: true
  num_epochs: 3
  max_steps: 1500  # REMAINING additional steps for this (third) run.
                    # Already done: 1500 (original) + 500 (first resume,
                    # saved as checkpoint-500 in -continued right before
                    # a session disconnect) = 2000 total. Target ~3500
                    # total (≈2 epochs) -> 1500 more needed this run.
  save_every_n_steps: 100
  logging_steps: 10
  step_offset: 2000  # Already-completed steps before this run starts -
                      # added to checkpoint numbers so they stay globally
                      # unique across resumes (this run's internal step
                      # 100 is saved as checkpoint-2100, not
                      # checkpoint-100 - avoids colliding with the
                      # existing checkpoint-100..500 in the SAME
                      # checkpoint_dir from the previous resume)
  keep_last_n_checkpoints: 3  # auto-delete older checkpoints saved by
                               # THIS run - Drive free space dropped
                               # 5GB->2.6GB from unbounded accumulation

# Resume from the LATEST confirmed-saved checkpoint - updated after each
# session disconnect. Currently: checkpoint-500 from the first resume
# (saved successfully right before an idle/max-duration disconnect).
resume_from_checkpoint: "/content/drive/MyDrive/text2sql-checkpoints-continued/checkpoint-500"

# Google Drive path - MUST be mounted before train.py runs (see RUNBOOK step 0)
# Reusing the SAME "-continued" folder as the previous run is now safe -
# step_offset (above) keeps checkpoint numbers from colliding.
checkpoint_dir: "/content/drive/MyDrive/text2sql-checkpoints-continued"

data:
  spider_split: "train"
  data_dir: "data/spider"
