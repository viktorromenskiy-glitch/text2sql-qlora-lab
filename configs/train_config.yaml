# QLoRA hyperparameters - fixed in advance, per technical_assignment.md
model_name: "Qwen/Qwen2.5-Coder-7B-Instruct"

lora:
  r: 32  # LORA RANK/ALPHA SWEEP - was r=16 always, never varied. Doubling
          # capacity to see if it helps or overfits faster. alpha kept at
          # 2x r ratio (matches our original r=16/alpha=32 ratio).
  alpha: 64
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

quantization:
  type: nf4
  double_quant: true

training:
  learning_rate: 2.0e-4
  batch_size: 4
  gradient_checkpointing: true
  num_epochs: 3  # FIXED at our proven optimum from the epoch sweep -
                  # only varying rank/alpha this time, not re-testing epochs.
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  save_every_n_steps: 200
  logging_steps: 10
  keep_last_n_checkpoints: 3

resume_from_checkpoint: null

checkpoint_dir: "/content/drive/MyDrive/text2sql-checkpoints-r32"

data:
  spider_split: "train"
  data_dir: "data/spider"
