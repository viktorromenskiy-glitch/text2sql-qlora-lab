# QLoRA hyperparameters - fixed in advance, per technical_assignment.md
model_name: "Qwen/Qwen2.5-Coder-7B-Instruct"

lora:
  r: 16
  alpha: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

quantization:
  type: nf4
  double_quant: true

training:
  learning_rate: 2.0e-4
  batch_size: 4
  gradient_checkpointing: true
  num_epochs: 4  # EPOCH SWEEP, part 3. Trend so far: 1ep=0.665,
                  # 2ep=0.700, 3ep=0.735 - still rising, not plateaued -
                  # worth checking 4 before assuming 3 is near-optimal.
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  save_every_n_steps: 200
  logging_steps: 10
  keep_last_n_checkpoints: 3

resume_from_checkpoint: null

checkpoint_dir: "/content/drive/MyDrive/text2sql-checkpoints-4epoch"

data:
  spider_split: "train"
  data_dir: "data/spider"
