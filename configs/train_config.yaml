# QLoRA hyperparameters - fixed in advance, per technical_assignment.md
model_name: "Qwen/Qwen2.5-Coder-7B-Instruct"

lora:
  r: 16
  alpha: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

quantization:
  type: nf4
  double_quant: true

training:
  learning_rate: 2.0e-4
  batch_size: 4
  gradient_checkpointing: true
  num_epochs: 1  # EPOCH SWEEP EXPERIMENT - was 2 (gave 0.700 pure SFT EX,
                  # our best/only result so far). Never independently
                  # verified 2 is optimal FOR OUR model - the reference
                  # work that got 77.2% swept 1-5 epochs and found 2 best
                  # for THEIRS (Llama 3 8B), we just copied their choice
                  # without our own sweep. Testing 1 and 3 to check.
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  save_every_n_steps: 200
  logging_steps: 10
  keep_last_n_checkpoints: 3

resume_from_checkpoint: null

# NEW folder for this experiment - keeps the existing best checkpoint
# (checkpoints-v2, 2 epochs, 0.700 pure SFT / 0.740 with all techniques)
# untouched and safe.
checkpoint_dir: "/content/drive/MyDrive/text2sql-checkpoints-1epoch"

data:
  spider_split: "train"
  data_dir: "data/spider"
