# QLoRA hyperparameters - fixed in advance, per technical_assignment.md
model_name: "Qwen/Qwen2.5-Coder-7B-Instruct"

lora:
  r: 16
  alpha: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

quantization:
  type: nf4
  double_quant: true

training:
  learning_rate: 2.0e-4
  batch_size: 4
  gradient_checkpointing: true
  num_epochs: 3
  save_every_n_steps: 50
  logging_steps: 10

# Google Drive path - MUST be mounted before train.py runs (see RUNBOOK step 0)
checkpoint_dir: "/content/drive/MyDrive/text2sql-checkpoints"

data:
  spider_split: "train"
  data_dir: "data/spider"
