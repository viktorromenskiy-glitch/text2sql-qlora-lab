# QLoRA hyperparameters - fixed in advance, per technical_assignment.md
model_name: "Qwen/Qwen2.5-Coder-7B-Instruct"

lora:
  r: 16
  alpha: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

quantization:
  type: nf4
  double_quant: true

training:
  learning_rate: 2.0e-4
  batch_size: 4
  gradient_checkpointing: true
  num_epochs: 2  # ~3500 steps on 7000 examples/batch_size 4 - matches
                  # the published reference result (Llama 3 8B, QLoRA,
                  # full Spider train, 2 epochs, 77.2% EX)
  lr_scheduler_type: cosine  # was constant (no schedule at all) - the
                              # published reference used cosine + 0.03
                              # warmup; our earlier runs used flat 2e-4
                              # the whole time, no warmup
  warmup_ratio: 0.03
  save_every_n_steps: 200
  logging_steps: 10
  keep_last_n_checkpoints: 3

# Explicitly NOT resuming this time - training from scratch in ONE
# continuous run. A real GitHub issue (modelscope/ms-swift #6008) and
# our own three-part resume history both point to resumed runs silently
# losing optimizer/scheduler state (AdamW momentum resets to zero,
# learning rate jumps back to full value with no warmup at each resume
# point) - a plausible contributor to accuracy getting worse with more
# training. Now that the RTX PRO 6000 makes a full run cheap (~15-20 min,
# ~2-3 compute units), avoiding resumes entirely removes this variable.
resume_from_checkpoint: null

# Google Drive path - NEW folder for this corrected run, kept separate
# from the previous (flawed) run's checkpoints for honest comparison.
checkpoint_dir: "/content/drive/MyDrive/text2sql-checkpoints-v2"

data:
  spider_split: "train"
  data_dir: "data/spider"
