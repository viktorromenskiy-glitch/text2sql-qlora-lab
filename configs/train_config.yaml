# QLoRA hyperparameters - fixed in advance, per technical_assignment.md
model_name: "Qwen/Qwen2.5-Coder-7B-Instruct"

lora:
  r: 16
  alpha: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

quantization:
  type: nf4
  double_quant: true

training:
  learning_rate: 2.0e-4
  batch_size: 4
  gradient_checkpointing: true
  num_epochs: 3
  max_steps: 1200  # loss plateaued around step 900-1000 on the interrupted
                    # run (see technical_lessons_learned.md) - stop with
                    # margin past that point rather than running the full
                    # 5250 steps for diminishing returns
  save_every_n_steps: 100  # was 50 - too many checkpoints (105) for
                            # available Drive space; halved given max_steps
                            # is also much lower now (12 checkpoints total)
  logging_steps: 10

# Google Drive path - MUST be mounted before train.py runs (see RUNBOOK step 0)
checkpoint_dir: "/content/drive/MyDrive/text2sql-checkpoints"

data:
  spider_split: "train"
  data_dir: "data/spider"
