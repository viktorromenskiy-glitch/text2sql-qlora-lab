# QLoRA hyperparameters - fixed in advance, per technical_assignment.md
model_name: "Qwen/Qwen2.5-Coder-7B-Instruct"

lora:
  r: 32  # LORA RANK/ALPHA SWEEP - was r=16 always, never varied. Doubling
          # capacity to see if it helps or overfits faster. alpha kept at
          # 2x r ratio (matches our original r=16/alpha=32 ratio).
  alpha: 64
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

quantization:
  type: nf4
  double_quant: true

training:
  learning_rate: 2.0e-4
  batch_size: 4
  gradient_checkpointing: true
  num_epochs: 2  # LORA RANK SWEEP, part 2 - r=32 at 3 epochs gave 0.670
                  # (worse than r=16's 0.735) - checking if r=32 simply
                  # overfits faster (earlier peak, e.g. at 2 epochs) with
                  # more capacity on the same 7000-example dataset,
                  # rather than being categorically worse.
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  save_every_n_steps: 200
  logging_steps: 10
  keep_last_n_checkpoints: 3

resume_from_checkpoint: null

checkpoint_dir: "/content/drive/MyDrive/text2sql-checkpoints-r32-2epoch"

data:
  spider_split: "train"
  data_dir: "data/spider"
